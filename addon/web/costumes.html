<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fly Wardrobe</title>
<style>
  :root { color-scheme: dark; --bg: #14161d; --panel: #1c1f28; --ink: #e6e8ee; --ink2: #9aa0b0; --line: rgba(255,255,255,0.08); --accent: #46c9b3; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; user-select: none; }
  #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--ink2); font-size: 12px; }
  header .spacer { flex: 1; }
  button { background: rgba(255,255,255,0.08); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover { background: rgba(255,255,255,0.14); }
  main { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  #left { border-right: 1px solid var(--line); display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #fly { width: 100%; height: 100%; display: block; min-height: 0; }
  #caption { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--ink2); font-size: 12px; }
  #caption b { color: var(--ink); }
  #right { overflow: auto; padding: 14px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; }
  .tile:hover { border-color: rgba(255,255,255,0.25); }
  .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tile .ic { font-size: 26px; line-height: 1.2; }
  .tile .nm { font-size: 12px; margin-top: 4px; }
  h2 { font-size: 12px; color: var(--ink2); margin: 0 0 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .tile.locked { opacity: .35; filter: grayscale(1); cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Fly Wardrobe</h1>
    <div class="sub" id="sub">pick a costume - it shows up on the fly right away</div>
    <div class="spacer"></div>
    <button id="close">Close</button>
  </header>
  <main>
    <div id="left">
      <canvas id="fly"></canvas>
      <div id="caption">wearing <b id="cur">nothing</b></div>
    </div>
    <div id="right">
      <h2>Costumes</h2>
      <div class="grid" id="grid"></div>
    </div>
  </main>
</div>
<script src="vendor/three.min.js"></script>
<script type="module" src="costumes.js"></script>
</body>
</html>
